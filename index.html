    <meta name="apple-mobile-web-app-title" content="12 Недель" />

    <style>
      html, body { background: #faf8fd; margin: 0; padding: 0; }
      #err { display:none; position:fixed; top:0; left:0; right:0; bottom:0;
             background:#fff; color:#c00; font:13px/1.5 monospace;
             padding:20px; overflow:auto; z-index:99999; white-space:pre-wrap; }
    </style>

    <!-- Visible error trap — shows JS crashes on screen without DevTools -->
    <script>
      function showErr(msg) {
        var d = document.getElementById('err');
        if (d) { d.style.display='block'; d.textContent += msg + '\n\n'; }
      }
      window.addEventListener('error', function(e) {
        showErr('ERROR: ' + e.message + '\n' + e.filename + ':' + e.lineno + '\n' + (e.error&&e.error.stack||''));
      });
      window.addEventListener('unhandledrejection', function(e) {
        showErr('PROMISE: ' + (e.reason&&e.reason.message||String(e.reason)) + '\n' + (e.reason&&e.reason.stack||''));
      });
    </script>
